name: 每週四自動更新資料

on:
  schedule:
    # 每週四台灣時間 12:00(UTC+8)= UTC 04:00 週四
    - cron: '0 4 * * 4'
  workflow_dispatch: {}   # 也可以在 GitHub Actions 頁面手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝 yt-dlp
        run: pip install yt-dlp

      - name: 抓取最新影片清單並重建 data.js
        run: python scrape.py

      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "自動更新資料 $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M') (台灣時間)"
          git push
